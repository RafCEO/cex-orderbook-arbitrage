[project]
name = "cex-orderbook-arbitrage"
version = "1.1.0"
description = "Cross-exchange crypto orderbook spread monitor: depth VWAP, slippage and net-of-fees arbitrage analytics"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "RafCEO" }]
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "pydantic>=2.6",
    "rich>=13.7",
    "PyYAML>=6.0",
    "aiosqlite>=0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# tests/test_vwap.py is preserved byte-identical to the original test commit
# (effe6a4): its style predates the formatter and modernization rules. Every
# other module, including all new test modules, is fully linted and formatted.
extend-exclude = ["tests/test_vwap.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "tests.*"
# Fixtures and assertions are self-describing; full annotations kept on helpers.
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "aiosqlite"
# aiosqlite ships no inline types and is not covered by typeshed.
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.coverage.run]
source = ["core", "connectors", "engine", "storage", "cli"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
